[build-system]
requires = ["setuptools", "setuptools-scm", "setuptools-rust>=1.1.0"]
build-backend = "setuptools.build_meta"

[project]
# The import name is mera; on PyPI, "mera" is another project.
name = "ucgmsim-mera"
authors = [{ name = "QuakeCoRE" }]
description = "Mixed-effects regression analysis"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
  "numpy",
  "pandas",
  "natsort",
  "scipy>=1.14",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "pyarrow",
]

[dependency-groups]
dev = ["deptry", "npdlint", "ruff", "ty"]

[tool.setuptools_scm]

[tool.setuptools.packages]
find = { where = ["."], include = ["mera", "mera.*"] }

[[tool.setuptools-rust.ext-modules]]
target = "mera._lmm"
path = "src-rust/Cargo.toml"
binding = "PyO3"
# Editable (in-place) installs would otherwise be debug builds, ~20x slower.
debug = false

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.lock" },
  { file = "**/Cargo.toml" },
  { file = "**/*.rs" },
]

[tool.deptry]
optional_dependencies_dev_groups = ["test"]
# Manual scripts, not part of the package.
extend_exclude = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# The guides: their code blocks are laid out for reading (comments aligned in columns),
# which the formatter would undo.
extend-exclude = ["docs"]

[tool.ruff.lint]
extend-select = [
  # isort imports
  "I",
  # Use r'\s+' rather than '\s+'
  "W605",
  # All the naming errors, like using camel case for function names.
  "N",
  # Missing docstrings in classes, methods, and functions
  "D101",
  "D102",
  "D103",
  "D105",
  "D107",
  # Use f-string instead of a format call
  "UP032",
  # Standard library import is deprecated
  "UP035",
  # Missing function argument type-annotation
  "ANN001",
  # Using except without specifying an exception type to catch
  "BLE001",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = [
  "source_modelling",
  "workflow",
  "pygmt_helper",
  "qcore",
  "empirical",
  "nshmdb",
  "IM_calculation",
  "mera",
]

[tool.ruff.lint.per-file-ignores]
# Ignore no docstring in __init__.py
"__init__.py" = ["D104"]
# Ignore docstring errors in tests folder
"tests/**.py" = ["D"]


[tool.npdlint]
include = ["mera"]
extend-exclude = ["__init__.py"]
numpydoc-compat = false
select = [
  "GL05",
  "GL08",
  "GL10",
  "PR01",
  "PR02",
  "PR03",
  "PR04",
  "PR05",
  "PR06",
  "PR07",
  "RT01",
  "RT02",
  "RT03",
  "RT04",
  "YD01",
]
