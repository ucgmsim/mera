[workspace]
members = ["crates/mera_lmm", "src-rust"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

# `warn` locally so in-progress work is not blocked; fix warnings before committing.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rust]
unused = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
