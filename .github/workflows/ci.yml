name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    uses: ucgmsim/meta-ci-action/.github/workflows/ci.yml@v2
    with:
      # Docstring scope and exclusions come from [tool.npdlint] in pyproject.toml.
      exclude-init: false
      enable-coverage: true
      cov-package: mera
      cov-fail-under: 95
      # The crate does numerics, so test the release profile too (as high-frequency does).
      rust-test-release: true
