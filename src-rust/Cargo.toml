[package]
name = "mera_lmm_py"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Python bindings for mera_lmm (the mera._lmm extension module)"
publish = false

[lib]
name = "_lmm"
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
mera_lmm = { path = "../crates/mera_lmm" }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }

[lints]
workspace = true
